<style>
:root{--b:#2563EB;--o:#F97316;--k:#0B0B0B;--w:#fff;--bg:#fff;--tx:#0B0B0B;--mu:#5b6270;--ln:#e6e8ee;--sf:#f5f7fb;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0B0B;--tx:#f4f5f7;--mu:#a3a9b6;--ln:#23262e;--sf:#14161b}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
img{max-width:100%}a{color:inherit}
.c{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800}h2{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:800}
.eyebrow{color:var(--b);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.mu{color:var(--mu)}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;border-radius:12px;padding:12px 22px;font:600 1rem inherit;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}
.p{background:var(--o);color:#fff}.p:hover{box-shadow:0 8px 20px #f9731655}
.s{border-color:var(--tx);color:var(--tx);background:transparent}.s:hover{background:var(--tx);color:var(--bg)}
.bl{background:var(--b);color:#fff}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:22px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0000001a}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.nav img.lg{height:38px}
.lnk{display:none;gap:18px;font-size:.92rem;font-weight:500}.lnk a{text-decoration:none;color:var(--mu)}.lnk a:hover{color:var(--b)}
.ib{background:none;border:1px solid var(--ln);border-radius:10px;padding:7px 11px;cursor:pointer;color:var(--tx);font:inherit}
.mm{display:none;flex-direction:column;padding:10px 20px 18px;border-top:1px solid var(--ln)}.mm.open{display:flex}.mm a{padding:11px 0;text-decoration:none;font-weight:600;border-bottom:1px solid var(--ln)}
@media(min-width:960px){.lnk{display:flex}#bg{display:none}.mm.open{display:none}}
.hero{padding:56px 0 40px;display:grid;gap:36px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1.1fr .9fr}}
.hero h1 span{color:var(--b)}.hero .tag{font-size:1.35rem;font-weight:700;color:var(--o);margin:.2em 0 .6em}
.vis{position:relative;display:grid;place-items:center;min-height:320px}
.vis img{width:min(70%,300px);border-radius:28px;animation:fl 6s ease-in-out infinite}
.bub{position:absolute;background:var(--tx);color:var(--bg);border-radius:16px 16px 16px 4px;padding:8px 14px;font-weight:700;font-size:.9rem;animation:fl 5s ease-in-out infinite}
.bub.b2{background:var(--b);color:#fff;border-radius:16px 16px 4px 16px;animation-delay:-2s}.bub.b3{background:var(--o);color:#fff;animation-delay:-3.5s}
@keyframes fl{50%{transform:translateY(-10px)}}
.stats{background:var(--k);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;text-align:center}
.stats b{display:block;font-size:2rem;color:var(--o)}
.pil{font-size:2rem}
.lv{display:flex;flex-direction:column;gap:10px}.lv .badge{align-self:flex-start;background:var(--b);color:#fff;border-radius:10px;padding:2px 12px;font-weight:800}
.test{background:var(--b);color:#fff;border-radius:24px;padding:44px 28px;text-align:center}
.test .btn{margin-top:10px}
.news img,.team img.ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--ln);margin-bottom:12px}
.team img.ph{aspect-ratio:1;border-radius:50%;width:110px;display:block;margin:0 auto 12px}.team{text-align:center}
.cat{display:inline-block;font-size:.72rem;font-weight:700;background:#f9731620;color:var(--o);border-radius:8px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;font-size:.88rem}.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
details{border:1px solid var(--ln);border-radius:14px;padding:14px 18px;margin-bottom:10px;background:var(--sf)}summary{cursor:pointer;font-weight:600}details p{margin:.6em 0 0;color:var(--mu)}
input,textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
footer{background:var(--k);color:#cfd3dc;padding:44px 0 30px;margin-top:40px}footer img{height:70px;border-radius:12px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px}
.md{background:var(--bg);border-radius:20px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:26px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;cursor:pointer;transition:border-color .15s}.opt:hover{border-color:var(--b)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--o);transition:width .3s}
.prv{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:60;background:var(--o);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;display:flex;gap:10px;align-items:center}
.adm{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column}
.ah{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap}.ah img{height:30px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--ln)}.tabs .chip{white-space:nowrap}
.ab{flex:1;overflow:auto;padding:16px;max-width:860px;width:100%;margin:0 auto}
.it{border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--sf)}
.r2{display:grid;gap:10px;grid-template-columns:1fr 1fr}@media(max-width:560px){.r2{grid-template-columns:1fr}}
.sm{padding:6px 12px;font-size:.85rem;border-radius:9px}
</style></head><body>

else if(AT=='order'){h=d.order.map((o,i)=>`<div class="it" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${o.on?'checked':''} onchange="ST.draft.order[${i}].on=this.checked;save()"><b style="flex:1">${o.id}</b><button class="btn s sm" onclick="mv(${i},-1)">↑</button><button class="btn s sm" onclick="mv(${i},1)">↓</button></div>`).join('')}
else if(AT=='links'){h=Object.keys(d.links).map(k=>fld('links.'+k,k,d.links[k])).join('')}

else if(AT=='users'){h=`<div class="it"><b>Roles preparados</b><p>👑 Administrador: todo · 👨‍🏫 Profesor/Tutor: noticias y recursos · 🎓 Estudiante: recursos y prueba · 👤 Visitante: contenido público.</p><p class="mu">Hoy solo existe la cuenta de administrador (Firebase Auth). Los roles de Profesor y Estudiante se pueden añadir después.</p></div>`}
else{const sp=FD[AT];h=d[AT].map((it,i)=>`<div class="it"><div class="r2">${sp.map(f=>f[2]?fld(`${AT}.${i}.${f[0]}_es`,f[1]+' (ES)',it[f[0]+'_es'],f[3])+fld(`${AT}.${i}.${f[0]}_en`,f[1]+' (EN)',it[f[0]+'_en'],f[3]):fld(`${AT}.${i}.${f[0]}`,f[1],it[f[0]],f[3],f[3]=='i')).join('')}</div><button class="btn s sm" style="margin-top:8px" onclick="ST.draft.${AT}.splice(${i},1);save();AP()">🗑 Eliminar</button></div>`).join('')+`<button class="btn bl" onclick="ad('${AT}')">+ Añadir</button>`}

if(e.type=='file')e.onchange=()=>{const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(r.result.length>250000){alert('Imagen muy pesada (máx ~180 KB). Usa una más pequeña o un enlace.');return}set(r.result);AP()};r.readAsDataURL(f)};else e.oninput=()=>set(e.value)})}
function mv(i,n){const o=ST.draft.order,j=i+n;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];save();AP()}
function ad(k){const t={levels:{id:'',n_es:'',n_en:'',d_es:'',d_en:'',g_es:'',g_en:'',c_es:'',c_en:''},news:{img:'',cat:'',date:new Date().toISOString().slice(0,10),t_es:'',t_en:'',d_es:'',d_en:''},res:{cat:'Grammar',type:'Link',url:'',t_es:'',t_en:''},team:{img:'',name:'',role:'',url:'',d_es:'',d_en:''},faq:{q_es:'',q_en:'',a_es:'',a_en:''},stats:{v:'',l_es:'',l_en:''}};ST.draft[k].push(t[k]);save();AP()}
async function pub(){const j=JSON.stringify(ST.draft);if(j.length>900000){alert('Contenido demasiado pesado: usa imágenes por enlace.');return}try{await FB.setDoc(FB.doc(FB.db,'site','live'),{j});ST.live=clone(ST.draft);ST.dirty=0;ls.s('etp4',JSON.stringify(ST));R();alert('¡Publicado para todos los visitantes!')}catch(e){alert('No se pudo publicar. Revisa tu sesión y las reglas de Firestore.')}}
R();
